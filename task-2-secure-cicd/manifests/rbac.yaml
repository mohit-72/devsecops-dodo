apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: payments
  name: ledger-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-rolebinding
  namespace: payments
subjects:
- kind: ServiceAccount
  name: ledger-sa
  namespace: payments
roleRef:
  kind: Role
  name: ledger-role
  apiGroup: rbac.authorization.k8s.io